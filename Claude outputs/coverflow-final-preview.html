iltration system for your home.&quot;,cta:&quot;Start the quiz&quot;},about:{eyebrow:&quot;About us&quot;,title:&quot;A.M Filters — scale-prevention specialists&quot;,body:&quot;At A.M Filters we specialize in water treatment and scale prevention for homes and businesses. We supply and install whole-home filtration systems, water-pressure regulators and check valves, and provide professional faucet replacement — all with personal service, expertise and reliability. Our goal is simple: clean, healthy water and plumbing protected from scale, for years to come.&quot;,cta:&quot;Contact us&quot;,badge:&quot;Scale experts&quot;},brandsHead:{title:&quot;Leading manufacturers we work with&quot;},brandsList:[&quot;Amiad&quot;,&quot;Slofos&quot;],footer:{tagline:&quot;A.M Filters — scale prevention, water filtration, pressure regulators, check valves &amp; faucet replacement.&quot;,colShop:&quot;Services&quot;,colInfo:&quot;Information&quot;,colContact:&quot;Contact&quot;,shopLinks:[&quot;Scale prevention&quot;,&quot;Whole-house systems&quot;,&quot;Pressure regulators&quot;,&quot;Check valves&quot;,&quot;Faucet replacement&quot;],infoLinks:[&quot;About us&quot;,&quot;Payment terms&quot;,&quot;Shipping policy&quot;,&quot;Warranty &amp; returns&quot;,&quot;Accessibility&quot;],address:&quot;Service &amp; installation nationwide&quot;,hours:&quot;Sun–Thu 08:00–18:00&quot;,rights:&quot;All rights reserved&quot;,newsletter:&quot;Join our list for deals &amp; offers&quot;,subscribe:&quot;Subscribe&quot;,emailPh:&quot;Email address&quot;,subscribed:&quot;Thanks! You&#x27;re on the list.&quot;}}},Pr=&quot;050-6830881&quot;,_r=&quot;info@am-filters.co.il&quot;,co=&quot;ספטמבר 2026&quot;,fo=&quot;September 2026&quot;,li={he:{privacyTitle:&quot;מדיניות פרטיות&quot;,privacyUpdated:`עודכן: ${co}`,privacy:[{h:&quot;כללי&quot;,p:[&#x27;אתר זה של א.מ שיווק מסננים למניעת אבנית (&quot;האתר&quot;) הוא אתר תדמיתי־שיווקי בלבד. אנו מכבדים את פרטיותכם ומחויבים לשמור עליה בהתאם לחוק הגנת הפרטיות, התשמ״א־1981 (כולל תיקון 13).&#x27;]},{h:&quot;איזה מידע אנחנו אוספים&quot;,p:[&quot;האתר אינו כולל הרשמת משתמשים, אינו מנהל חשבונות משתמש, ואין לו שרת או מסד נתונים שאוסף או שומר פרטים אישיים.&quot;,&quot;יצירת קשר נעשית באמצעות לחיצה על מספר הטלפון או על כפתור הוואטסאפ — פעולות אלו מפעילות את אפליקציית הטלפון/הוואטסאפ במכשירכם, ואינן שולחות מידע לאתר עצמו.&quot;,&quot;טופס הרשמה לרשימת תפוצה: כרגע הטופס אינו מחובר לשירות דיוור ואינו שולח או שומר את כתובת האימייל בשום מקום. אם וכאשר יחובר שירות דיוור, נעדכן מדיניות זו בהתאם.&quot;,&#x27;שאלון &quot;איזה פתרון מתאים לי?&quot;: כל התשובות מעובדות בדפדפן שלכם בלבד לצורך הצגת ההמלצה, ואינן נשלחות אלינו או נשמרות בשרת.&#x27;]},{h:&quot;עוגיות (Cookies) וכלי מדידה&quot;,p:[&quot;האתר אינו עושה שימוש בעוגיות מעקב, בכלי אנליטיקה או ברימרקטינג.&quot;,&quot;העדפות הנגישות שתבחרו נשמרות מקומית בדפדפן שלכם (localStorage) לנוחותכם בלבד, ואינן נשלחות אלינו או לצד שלישי.&quot;]},{h:&quot;שירותים של צד שלישי&quot;,p:[&quot;לחיצה על כפתור הוואטסאפ פותחת שיחה בשירות WhatsApp (מבית Meta), הכפוף למדיניות הפרטיות שלו.&quot;,&#x27;קישור &quot;המלצות לקוחות במדרג&quot; מפנה לאתר מדרג (midrag.co.il), הכפוף למדיניות הפרטיות שלו.&#x27;,&quot;האתר מתארח על תשתית ענן (Vercel). כמקובל בכל אתר, ספק האירוח עשוי לתעד נתונים טכניים בסיסיים (כגון כתובת IP וסוג הדפדפן) לצורכי אבטחה ותפעול.&quot;]},{h:&quot;הזכויות שלכם&quot;,p:[&quot;בהתאם לחוק, עומדת לכם הזכות לעיין במידע אישי המוחזק אודותיכם (ככל שקיים), לבקש לתקנו או למחקו. מכיוון שהאתר אינו אוסף מידע אישי בשרת, בקשות מסוג זה יטופלו ביחס למידע שמסרתם לנו ישירות בטלפון או בוואטסאפ.&quot;,`לפניות בנושא פרטיות: טלפון ${Pr} · דוא״ל ${_r}.`]},{h:&quot;עדכונים למדיניות&quot;,p:[&quot;ייתכן שנעדכן מדיניות זו מעת לעת. הנוסח המעודכן יפורסם בעמוד זה עם תאריך העדכון.&quot;]}],a11yTitle:&quot;הצהרת נגישות&quot;,a11yUpdated:`עודכן: ${co}`,a11y:[{h:&quot;המחויבות שלנו&quot;,p:[&quot;א.מ שיווק מסננים רואה חשיבות רבה במתן שירות שוויוני ונגיש לכלל הגולשים, לרבות אנשים עם מוגבלות. אנו פועלים להנגיש את האתר בהתאם לתקן הישראלי ת״י 5568 (המבוסס על הנחיות WCAG 2.0 ברמה AA) ולתקנות שוויון זכויות לאנשים עם מוגבלות (התאמות נגישות לשירות), התשע״ג־2013.&quot;]},{h:&quot;מה הונגש באתר&quot;,p:[&quot;ניווט מלא באמצעות מקלדת ומיקוד (focus) חזותי ברור.&quot;,&quot;מבנה HTML סמנטי, כותרות היררכיות, וטקסט חלופי לתמונות בעלות משמעות.&quot;,&quot;תוויות ARIA לכפתורים ולרכיבים אינטראקטיביים, כולל החלונות הקופצים (מודלים) והשאלון.&quot;,&quot;תמיכה מלאה בעברית ובכיוון RTL, וניגודיות צבעים תקינה.&quot;,&quot;התאמה להעדפת המערכת להפחתת אנימציות (prefers-reduced-motion).&quot;]},{h:&quot;תפריט הנגישות&quot;,p:[&quot;באתר מוטמע כפתור נגישות קבוע (בפינת המסך) הפותח תפריט המאפשר: הגדלה והקטנה של גודל הטקסט, מצב ניגודיות גבוהה, הדגשת קישורים, גופן קריא, ועצירת אנימציות. ההעדפות נשמרות במכשירכם.&quot;]},{h:&quot;הסתייגויות&quot;,p:[&quot;ייתכנו רכיבים או תכנים של צד שלישי (כגון אתר מדרג המקושר מהאתר) שאינם בשליטתנו המלאה. אנו ממשיכים לשפר את הנגישות באופן שוטף.&quot;]},{h:&quot;יצירת קשר בנושא נגישות&quot;,p:[`נתקלתם בבעיית נגישות? נשמח לסייע. רכז הנגישות זמין בטלפון ${Pr} או בדוא״ל ${_r}.`]}]},en:{privacyTitle:&quot;Privacy Policy&quot;,privacyUpdated:`Updated: ${fo}`,privacy:[{h:&quot;General&quot;,p:[&#x27;This website of A.M. Anti-Limescale Filters (&quot;the Site&quot;) is an informational/marketing site only. We respect your privacy and are committed to it under Israel’s Protection of Privacy Law, 1981 (including Amendment 13).&#x27;]},{h:&quot;What we collect&quot;,p:[&quot;The Site has no user registration, no user accounts, and no server or database that collects or stores personal data.&quot;,&quot;Contact is made by tapping the phone number or the WhatsApp button — these open your phone/WhatsApp app and do not send information to the Site itself.&quot;,&quot;Newsletter field: it is currently not connected to any mailing service and does not send or store your email anywhere. If a mailing service is connected, this policy will be updated accordingly.&quot;,&#x27;The &quot;which solution fits me?&quot; questionnaire: all answers are processed in your browser only to display the recommendation, and are not sent to us or stored on a server.&#x27;]},{h:&quot;Cookies &amp; analytics&quot;,p:[&quot;The Site does not use tracking cookies, analytics, or remarketing.&quot;,&quot;Accessibility preferences you choose are stored locally in your browser (localStorage) for your convenience only, and are not sent to us or any third party.&quot;]},{h:&quot;Third-party services&quot;,p:[&quot;The WhatsApp button opens a chat in WhatsApp (by Meta), governed by its own privacy policy.&quot;,&#x27;The &quot;customer reviews on Midrag&quot; link goes to midrag.co.il, governed by its own privacy policy.&#x27;,&quot;The Site is hosted on cloud infrastructure (Vercel). As with any website, the host may log basic technical data (such as IP address and browser type) for security and operation.&quot;]},{h:&quot;Your rights&quot;,p:[&quot;By law you may review personal data held about you (if any), and request to correct or delete it. As the Site does not collect personal data on a server, such requests will be handled regarding information you gave us directly by phone or WhatsApp.&quot;,`Privacy inquiries: phone ${Pr} · email ${_r}.`]},{h:&quot;Updates&quot;,p:[&quot;We may update this policy from time to time. The updated version will be posted on this page with its date.&quot;]}],a11yTitle:&quot;Accessibility Statement&quot;,a11yUpdated:`Updated: ${fo}`,a11y:[{h:&quot;Our commitment&quot;,p:[&quot;A.M. Filters is committed to equal, accessible service for all visitors, including people with disabilities. We work to make the Site accessible per Israeli Standard IS 5568 (based on WCAG 2.0 Level AA) and the Equal Rights for Persons with Disabilities (Service Accessibility) Regulations, 2013.&quot;]},{h:&quot;What is accessible&quot;,p:[&quot;Full keyboard navigation with a clear visible focus indicator.&quot;,&quot;Semantic HTML, hierarchical headings, and alternative text for mean
